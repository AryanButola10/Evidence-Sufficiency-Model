[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reliability-rag"
version = "0.1.0"
description = "A Reliability-Oriented RAG Framework Using Evidence Sufficiency Modeling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Aryan Butola", email = "aryan@reliability-rag.local" }
]
keywords = [
    "RAG",
    "retrieval-augmented-generation",
    "evidence-sufficiency",
    "NLP",
    "hallucination-detection",
    "information-retrieval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/aryanbutola/reliability-rag"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "config*"]

# -----------------------------------------------------------
# Pytest configuration
# -----------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# -----------------------------------------------------------
# Ruff linter configuration
# -----------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src", "api", "config"]

# -----------------------------------------------------------
# MyPy type checking (optional, progressively enable)
# -----------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
